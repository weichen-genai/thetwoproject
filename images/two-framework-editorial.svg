<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">The T-W-O framework</title>
  <desc id="desc">Organization contains workflow, and workflow contains task.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f1ece2"/>
    </linearGradient>
    <linearGradient id="organization" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66715b"/>
      <stop offset="1" stop-color="#4f5945"/>
    </linearGradient>
    <linearGradient id="workflow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ee"/>
      <stop offset="1" stop-color="#e8dfcf"/>
    </linearGradient>
    <linearGradient id="task" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c49a92"/>
      <stop offset="1" stop-color="#9f6f67"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-15%" width="116%" height="135%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#1f1f1a" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-8%" y="-20%" width="116%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#1f1f1a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1440" height="640" rx="34" fill="url(#page)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="720" y="74" text-anchor="middle" fill="#1f1f1a" font-size="50" font-weight="720">The T-W-O framework</text>
    <path d="M102 104 H1338" stroke="#d9d3c6" stroke-width="1"/>

    <g filter="url(#shadow)">
      <rect x="112" y="136" width="1216" height="402" rx="42" fill="url(#organization)" stroke="#859076" stroke-width="2"/>
    </g>
    <text x="176" y="206" fill="#fffdf9" font-size="34" font-weight="730">Organization</text>
    <text x="176" y="246" fill="#e2ddcf" font-size="25">Governance, structure, incentives</text>

    <g filter="url(#softShadow)">
      <rect x="190" y="278" width="1060" height="224" rx="34" fill="url(#workflow)" stroke="#d8cbbb" stroke-width="2"/>
    </g>
    <text x="252" y="346" fill="#4f5945" font-size="34" font-weight="730">Workflow</text>
    <text x="252" y="386" fill="#66715b" font-size="25">Sequences, handoffs, coordination</text>

    <g filter="url(#softShadow)">
      <rect x="268" y="412" width="904" height="74" rx="24" fill="url(#task)" stroke="#d6a59c" stroke-width="2"/>
    </g>
    <text x="322" y="458" fill="#fff8ef" font-size="29" font-weight="760">Task</text>
    <text x="1110" y="456" text-anchor="end" fill="#ffe1d8" font-size="24" font-weight="650">Atomic units of work</text>
  </g>
</svg>
